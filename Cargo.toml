[package]
name = "isabel-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/bindings", "crates/linux-event-codes", "demo/isabel"]

[features]
aot = [
    "bindings/aot",
] # This enables the aot feature in bindings when enabled here

[dependencies]
bindings = { path = "./crates/bindings", features = ["aot"] }
linux-event-codes = { path = "./crates/linux-event-codes" }

num-derive = "0.4.2"
num-traits = "0.2.19"
cursor-icon = "1.1.0"
env_logger = "0.11.5"
anyhow = "1.0.86"
clap = { version = "4.5.19", features = ["derive"] }
khronos-egl = { version = "6.0.0", features = ["static"] }
log = "0.4.22"
raw-window-handle = "0.6.2"
wayland-client = { version = "0.31.1" }
wayland-backend = { version = "0.3.0", features = ["client_system"] }
smithay-client-toolkit = "0.19.2"
wayland-egl = "0.32.4"
downcast-rs = "1.2.1"
xkeysym = "0.2.1"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "1.0.64"

[dev-dependencies]
glow = "0.15.0"
